name: iOS-ipa-build (legacy)

# Prefer "Build APK & iOS" (build-mobile.yml). Kept for manual iOS-only runs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: ./apps/desktop

      # Project uses Swift Package Manager (no Podfile).
      - run: flutter build ios --release --no-codesign
        working-directory: ./apps/desktop

      - name: Package unsigned IPA
        run: |
          mkdir -p apps/desktop/build/ios/ipa/Payload
          cp -r apps/desktop/build/ios/iphoneos/Runner.app apps/desktop/build/ios/ipa/Payload/
          cd apps/desktop/build/ios/ipa
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: iOS IPA v1.0.${{ github.run_number }}
          body: Automated unsigned iOS IPA build from workflow_dispatch.
          files: apps/desktop/build/ios/ipa/FlutterIpaExport.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
