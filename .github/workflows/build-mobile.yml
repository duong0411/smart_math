name: Build APK, iOS & Windows

on:
  push:
    branches: [main, ngu-van]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduself-nguvan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ngu-van'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nguvan-android-v1.0.${{ github.run_number }}
          name: Ngữ văn Android APK v1.0.${{ github.run_number }}
          body: Automated release APK build for EduSelf Ngữ Văn (signed with debug keystore for CI).
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Project uses Swift Package Manager (no Podfile). Flutter resolves
      # iOS deps during build — do not run `pod install`.
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qq -r -9 EduSelfNguVan.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduself-nguvan-ipa
          path: build/ios/ipa/EduSelfNguVan.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ngu-van'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nguvan-ios-v1.0.${{ github.run_number }}
          name: Ngữ văn iOS IPA v1.0.${{ github.run_number }}
          body: Automated unsigned iOS IPA for EduSelf Ngữ Văn (no Apple signing). Install via developer tools / sideload only.
          files: build/ios/ipa/EduSelfNguVan.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows Release folder
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "EduSelfNguVan-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduself-nguvan-windows
          path: EduSelfNguVan-windows.zip
          if-no-files-found: error

      - name: Publish Windows zip to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ngu-van'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nguvan-windows-v1.0.${{ github.run_number }}
          name: Ngữ văn Windows EXE v1.0.${{ github.run_number }}
          body: |
            Windows desktop build for EduSelf Ngữ Văn (unzip and run `eduself_study_app.exe`).
            Keep the whole extracted folder together (DLL + data).
          files: EduSelfNguVan-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
