name: Build APK, iOS & Windows

on:
  push:
    branches: [main, dialy, mon-dia-ly]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-math-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Release prefix
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=dialy-" >> "$GITHUB_OUTPUT"
            echo "label=Địa lí · " >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dialy' || github.ref == 'refs/heads/mon-dia-ly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.prefix }}android-v1.0.${{ github.run_number }}
          name: ${{ steps.meta.outputs.label }}Android APK v1.0.${{ github.run_number }}
          body: Automated release APK build (signed with debug keystore for CI).
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Project uses Swift Package Manager (no Podfile). Flutter resolves
      # iOS deps during build — do not run `pod install`.
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qq -r -9 SmartMath.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-math-ipa
          path: build/ios/ipa/SmartMath.ipa
          if-no-files-found: error

      - name: Release prefix
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=dialy-" >> "$GITHUB_OUTPUT"
            echo "label=Địa lí · " >> "$GITHUB_OUTPUT"
          fi

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dialy' || github.ref == 'refs/heads/mon-dia-ly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.prefix }}ios-v1.0.${{ github.run_number }}
          name: ${{ steps.meta.outputs.label }}iOS IPA v1.0.${{ github.run_number }}
          body: Automated unsigned iOS IPA (no Apple signing). Install via developer tools / sideload only.
          files: build/ios/ipa/SmartMath.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip Windows Release folder
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "SmartMath-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-math-windows
          path: SmartMath-windows.zip
          if-no-files-found: error

      - name: Release prefix
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "prefix=" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=dialy-" >> "$GITHUB_OUTPUT"
            echo "label=Địa lí · " >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Windows zip to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dialy' || github.ref == 'refs/heads/mon-dia-ly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.prefix }}windows-v1.0.${{ github.run_number }}
          name: ${{ steps.meta.outputs.label }}Windows EXE v1.0.${{ github.run_number }}
          body: |
            Windows desktop build (unzip and run `eduself_study_app.exe`).
            Keep the whole extracted folder together (DLL + data).
          files: SmartMath-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
